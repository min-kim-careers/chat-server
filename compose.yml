services:
  chat-db-service:
    container_name: chat-db-container
    restart: always
    image: postgres:latest
    environment:
      - POSTGRES_USER=chatdbuser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=chatdb
    volumes:
      - chat-db-data:/var/lib/postgresql/data

  chat-cache-service:
    container_name: chat-cache-container
    restart: always
    image: redis:latest
    environment:
      - REDIS_HOST=chat-cache-service
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: [ '/bin/sh', '-c', 'redis-server --save 20 1 --loglevel warning --requirepass $$REDIS_PASSWORD' ]
    volumes:
      - chat-cache-data:/data

  chat-server-service:
    depends_on:
      - chat-db-service
      - chat-cache-service
    container_name: chat-server-container
    restart: always
    build: .
    environment:
      # Postgres
      - DB_HOST=chat-db-service
      - DB_PORT=5432
      - DB_USER=chatdbuser
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=chatdb

      # Redis
      - CACHE_HOST=chat-cache-service
      - CACHE_PORT=6379
      - CACHE_PASSWORD=${CACHE_PASSWORD}
      - CACHE_DB=0

      - AUTH_URL=http://auth-service:8000
      - AUTH_KEY=b6c54fe621c6df75a54f0c245956519251adae29c2a0fa1c7f1cc03674f61ce5
      - AUTH_KEY_HEADER=x-auth-key
    env_file:
      - .env
    volumes:
      - ./app:/app

volumes:
  chat-db-data:
  chat-cache-data: